<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; }
        
        .gallery-albums {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }
        
        .album-tile {
            position: relative;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            height: 300px;
        }
        
        .album-tile:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .album-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .album-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
            color: white;
            padding: 2rem 1rem 1rem;
        }
        
        .album-info h3 {
            margin: 0;
            font-size: 1.5rem;
        }
        
        .album-info p {
            margin: 0.5rem 0 0;
            font-size: 0.9rem;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 { margin: 0; }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            color: #333;
        }
        
        .modal-photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }
        
        .photo-item {
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .photo-item:hover {
            transform: scale(1.05);
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Gallery Test</h1>
    
    <div class="gallery-albums">
        <div class="album-tile" onclick="openAlbum(this)">
            <img src="images\Sasanaramsi Vihara.jpg" alt="2025 Album">
            <div class="album-info">
                <h3>2025</h3>
                <p>4 photos</p>
            </div>
        </div>
        
        <div class="album-tile" onclick="openAlbum(this)">
            <img src="images\Sasanaramsi Vihara 3.jpg" alt="2024 Album">
            <div class="album-info">
                <h3>2024</h3>
                <p>4 photos</p>
            </div>
        </div>
    </div>
    
    <!-- Album Modal -->
    <div id="albumModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalAlbumTitle">Album</h2>
                <button class="close-modal" onclick="closeAlbum()">&times;</button>
            </div>
            <div class="modal-photos" id="modalPhotosContainer">
                <!-- Photos will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        let currentPhotoIndex = 0;
        let currentAlbumPhotos = [];

        // Define album data
        const albums = {
            '2025': [
                { src: 'images\\Sasanaramsi Vihara.jpg', alt: 'Main Monastery' },
                { src: 'images\\Sasanaramsi Vihara 2.jpg', alt: 'Buddha Statue' },
                { src: 'images\\Activities 2.jpg', alt: 'Meditation Hall' },
                { src: 'images\\Activities 1.jpg', alt: 'Group Gathering' }
            ],
            '2024': [
                { src: 'images\\Sasanaramsi Vihara 3.jpg', alt: 'Evening Prayer' },
                { src: 'images\\Sasanaramsi Vihara 4.jpg', alt: 'Monastery Building' },
                { src: 'images\\Activites 3.jpg', alt: 'Monastery Garden' },
                { src: 'images\\U Thi.jpg', alt: 'Venerable Monk' }
            ]
        };

        function openAlbum(element) {
            console.log('Opening album...');
            const albumTitle = element.querySelector('.album-info h3').textContent;
            console.log('Album title:', albumTitle);
            const modal = document.getElementById('albumModal');
            const photosContainer = document.getElementById('modalPhotosContainer');
            
            // Set album title
            document.getElementById('modalAlbumTitle').textContent = albumTitle;
            
            // Get photos for this album
            const photos = albums[albumTitle] || [];
            console.log('Photos:', photos);
            currentAlbumPhotos = photos;
            
            // Generate HTML for photos
            photosContainer.innerHTML = photos.map((photo, index) => 
                `<div class="photo-item">
                    <img src="${photo.src}" alt="${photo.alt}">
                </div>`
            ).join('');
            
            // Show modal
            modal.style.display = 'flex';
            console.log('Modal displayed');
        }

        function closeAlbum() {
            document.getElementById('albumModal').style.display = 'none';
        }

        // Close modal when clicking outside of it
        window.addEventListener('click', (e) => {
            const albumModal = document.getElementById('albumModal');
            if (e.target === albumModal) {
                closeAlbum();
            }
        });
    </script>
</body>
</html>
