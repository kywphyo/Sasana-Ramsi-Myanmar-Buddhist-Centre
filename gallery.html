<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Sasana Ramsi Vihara</title>
    <link rel="icon" type="image/png" href="images/logo-transparent.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="container">
                <h1 class="logo"><img src="images/logo-transparent.png" alt="Sasana Ramsi Vihara Logo"></h1>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
    </header>

    <section id="gallery">
        <div class="container">
            <h2>Gallery</h2>
            <div class="gallery-albums">
                <!-- 2025 Album -->
                <div class="album-tile" onclick="openAlbum(this)">
                    <img src="images/Sasana Ramsi 2025/504183502_1131133172376750_1218493082655093356_n.jpg" alt="2025 Album">
                    <div class="album-info">
                        <h3>2025</h3>
                        <p>7 photos</p>
                    </div>
                </div>

                <!-- 2024 Album -->
                <div class="album-tile" onclick="openAlbum(this)">
                    <img src="images/Sasan Ramsi 2024/484503056_1065662992257102_6428353005039563766_n.jpg" alt="2024 Album">
                    <div class="album-info">
                        <h3>2024</h3>
                        <p>7 photos</p>
                    </div>
                </div>

                <!-- 2023 Album -->
                <div class="album-tile" onclick="openAlbum(this)">
                    <img src="images/Sasana Ramsi 2023/480273407_1042589887897746_4681106906146158410_n.jpg" alt="2023 Album">
                    <div class="album-info">
                        <h3>2023</h3>
                        <p>7 photos</p>
                    </div>
                </div>

                <!-- 2020 Album -->
                <div class="album-tile" onclick="openAlbum(this)">
                    <img src="images/Sasana Ramsi 2020/60925520_10156680260113227_7772591569563025408_n.jpg" alt="2020 Album">
                    <div class="album-info">
                        <h3>2020</h3>
                        <p>6 photos</p>
                    </div>
                </div>
                
                <!-- 2019 Album -->
                <div class="album-tile" onclick="openAlbum(this)">
                    <img src="images/Sasana Ramsi 2019/471638786_10161454123288227_5962029447539752372_n.jpg" alt="2019 Album">
                    <div class="album-info">
                        <h3>2019</h3>
                        <p>7 photos</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Album Modal -->
    <div id="albumModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalAlbumTitle">Album</h2>
                <button class="close-modal" onclick="closeAlbum()">&times;</button>
            </div>
            <div class="modal-photos" id="modalPhotosContainer">
                <!-- Photos will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-container">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <button class="lightbox-prev" onclick="previousPhoto()">&#10094;</button>
            <img id="lightboxImage" class="lightbox-image" src="" alt="">
            <button class="lightbox-next" onclick="nextPhoto()">&#10095;</button>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Sasana Ramsi Vihara. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
